<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0b"><meta name="description" content="Mafia Party — достарыңыздың бөлмесіне қосылыңыз.">
<title>Mafia Party — шақыру</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#090a0b;color:#f5f3ef;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,#9b20221f,transparent 60%)}header,footer{position:relative;width:min(100% - 40px,1040px);margin:auto;display:flex;align-items:center;justify-content:space-between;padding:24px 0}.brand{font-size:13px;font-weight:750;letter-spacing:3px}.brand span{color:#ce484d}select{background:#161719;border:1px solid #353638;border-radius:10px;color:#ddd;padding:8px;font:inherit;font-size:13px}main{position:relative;flex:1;display:grid;place-items:center;padding:30px 20px 54px}.card{width:min(100%,480px);padding:36px;background:linear-gradient(160deg,#1d1c1e,#111214);border:1px solid #343034;border-radius:24px;box-shadow:0 24px 90px #0006}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:#df8588;font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(32px,7vw,44px);line-height:1.13;letter-spacing:-1px;margin:16px 0}p{font-size:15px;line-height:1.65;color:#b6b3b4;margin:0 0 26px}label{display:block;color:#aaa7a9;font-size:12px;margin-bottom:12px}input{width:100%;border:1px solid #444045;border-radius:14px;background:#090a0bb3;color:#fff;font:600 clamp(25px,8vw,36px)/1.3 ui-monospace,monospace;letter-spacing:.24em;text-align:center;padding:17px 8px;margin-bottom:18px}input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #ed858a;outline-offset:4px}button{cursor:pointer;border:0;border-radius:12px;font:650 15px system-ui;min-height:50px;width:100%;padding:12px 16px;background:#b8202b;color:#fff}button:active{background:#9a1c25}.secondary{margin-top:10px;background:#252427;border:1px solid #403b40;color:#eee}.note{font-size:13px;margin:24px 0 0;border-top:1px solid #343034;padding-top:20px}.status{min-height:20px;color:#eeb8bb;font-size:13px;margin-top:12px}footer{color:#807b80;font-size:12px;border-top:1px solid #242225}.tag{color:#888;font-size:12px}@media(max-width:400px){.card{padding:26px 20px}header,footer{width:calc(100% - 32px)}}
</style>
</head>
<body>
<header><div class="brand">MAFIA<span> PARTY</span></div><select id="language" aria-label="Language"><option value="kk">Қазақша</option><option value="ru">Русский</option><option value="en">English</option></select></header>
<main><section class="card"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="intro"></p><form id="joinForm"><label for="code" id="codeLabel"></label><input id="code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"><button id="open" type="submit"></button><button id="copy" class="secondary" type="button"></button></form><div id="status" class="status" role="status" aria-live="polite"></div><p class="note" id="note"></p></section></main>
<footer><span>© Mafia Party</span><span class="tag">mafiaparty.click</span></footer>
<script>
'use strict';
const strings={kk:{eyebrow:'Достармен бір үстелде',title:'Қала сені күтеді.',intro:'Бөлмеге қосылып, кімге сенуге болатынын анықта.',codeLabel:'Бөлме коды',open:'Mafia қосымшасында ашу',copy:'Кодты көшіру',copied:'Бөлме коды көшірілді',invalid:'Алты саннан тұратын бөлме кодын енгізіңіз.',opening:'Қосымша ашылмаса, оның орнатылғанын тексеріңіз.',note:'Mafia орнатылған болуы керек. Орнатқаннан кейін осы сілтемені қайта ашыңыз. Кодпен қосылу мүмкіндігі қосымшада да бар.',copyFailed:'Кодты жоғарыдағы өрістен белгілеп көшіре аласыз.'},ru:{eyebrow:'За одним столом с друзьями',title:'Город ждёт тебя.',intro:'Присоединяйся к комнате и решай, кому можно доверять.',codeLabel:'Код комнаты',open:'Открыть в приложении Mafia',copy:'Скопировать код',copied:'Код комнаты скопирован',invalid:'Введите шестизначный код комнаты.',opening:'Если приложение не открылось, убедитесь, что оно установлено.',note:'Необходимо установленное приложение Mafia. После установки откройте эту ссылку ещё раз. В приложении также можно войти по коду.',copyFailed:'Выделите и скопируйте код из поля выше.'},en:{eyebrow:'One table. All your friends.',title:'The city is waiting.',intro:'Join the room and decide who you can trust.',codeLabel:'Room code',open:'Open in the Mafia app',copy:'Copy room code',copied:'Room code copied',invalid:'Enter a six-digit room code.',opening:'If the app did not open, make sure it is installed.',note:'The Mafia app must be installed. After installing, open this link again. You can also join by entering the code in the app.',copyFailed:'Select and copy the code from the field above.'}};
const byId=id=>document.getElementById(id),input=byId('code');
let language=(navigator.language||'en').slice(0,2);if(!strings[language])language='en';
function render(){document.documentElement.lang=language;byId('language').value=language;for(const id of ['eyebrow','title','intro','codeLabel','open','copy','note'])byId(id).textContent=strings[language][id];byId('status').textContent='';}
byId('language').addEventListener('change',event=>{language=event.target.value;render()});
const url=new URL(location.href);const code=url.searchParams.get('code')||location.pathname.match(/^\/join\/([0-9]{6})\/?$/)?.[1]||'';
if(/^[0-9]{6}$/.test(code))input.value=code;
input.addEventListener('input',()=>{input.value=input.value.replace(/[^0-9]/g,'').slice(0,6);byId('status').textContent=''});
byId('joinForm').addEventListener('submit',event=>{event.preventDefault();if(!/^[0-9]{6}$/.test(input.value)){byId('status').textContent=strings[language].invalid;return}byId('status').textContent=strings[language].opening;location.href='mafiaparty://join?code='+encodeURIComponent(input.value)});
byId('copy').addEventListener('click',async()=>{if(!/^[0-9]{6}$/.test(input.value)){byId('status').textContent=strings[language].invalid;input.focus();return}try{await navigator.clipboard.writeText(input.value);byId('status').textContent=strings[language].copied}catch{input.focus();input.select();byId('status').textContent=strings[language].copyFailed}});
render();
</script>
</body></html>
